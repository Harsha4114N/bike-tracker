<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Fleet GPS Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #e9ecef; }
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        .input-field { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; }
        .btn { background: #0056b3; color: white; padding: 14px; width: 100%; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        
        #dashboard { display: none; height: 100vh; flex-direction: column; }
        #control-panel { background: #1a252f; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }
        .status-offline { background: #e74c3c; color: white; }
        .status-online { background: #2ecc71; color: white; }
        select { padding: 8px 12px; border-radius: 5px; font-weight: bold; width: 280px; }
        #map { flex-grow: 1; width: 100%; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>Admin Login</h2>
            <input type="email" id="email" class="input-field" placeholder="Admin Email">
            <input type="password" id="password" class="input-field" placeholder="Password">
            <button class="btn" onclick="adminLogin()">SECURE LOGIN</button>
            <p id="error-msg" style="color: red; font-size: 14px; display: none;"></p>
        </div>
    </div>

    <div id="dashboard">
        <div id="control-panel">
            <div style="display: flex; align-items: center; gap: 15px;">
                <h3 style="margin: 0;">GPS Dashboard</h3>
                <span id="bt-status" class="status-badge status-offline">Bluetooth: Disconnected</span>
            </div>
            <div>
                <select id="ride-selector" onchange="switchMode()">
                    <option value="live">🔴 Live Tracking</option>
                </select>
                <button onclick="location.reload()" style="padding: 8px 14px; margin-left: 10px; cursor: pointer;">Logout</button>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <script>
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyB8IdMOqZlzZrJghi0ykiZBrHEI2SNnTsU",
  authDomain: "delivery-tracker-e1fef.firebaseapp.com",
  databaseURL: "https://delivery-tracker-e1fef-default-rtdb.firebaseio.com",
  projectId: "delivery-tracker-e1fef",
  storageBucket: "delivery-tracker-e1fef.firebasestorage.app",
  messagingSenderId: "481064109063",
  appId: "1:481064109063:web:08c552023c98b7fe3996a2",
  measurementId: "G-72GZV2027B"
};
        firebase.initializeApp(firebaseConfig);

        let map, marker, routeLine, liveListener;

        function adminLogin() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            
            firebase.auth().signInWithEmailAndPassword(email, pass)
                .then(() => {
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'flex';
                    initMap();
                    fetchRideHistory();
                    startLiveTracking();
                })
                .catch((error) => {
                    const err = document.getElementById('error-msg');
                    err.innerText = "Access Denied: " + error.message;
                    err.style.display = 'block';
                });
        }

        function initMap() {
            map = L.map('map').setView([12.9143, 77.6103], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
        }

        function fetchRideHistory() {
            firebase.database().ref('/rides').on('value', (snapshot) => {
                const selector = document.getElementById('ride-selector');
                selector.innerHTML = '<option value="live">🔴 Live Tracking</option>';
                snapshot.forEach((child) => {
                    const rideKey = child.key;
                    const opt = document.createElement('option');
                    opt.value = rideKey;
                    opt.innerText = "🗓️ " + rideKey;
                    selector.appendChild(opt);
                });
            });
        }

        function switchMode() {
            const mode = document.getElementById('ride-selector').value;
            if (marker) { map.removeLayer(marker); marker = null; }
            if (routeLine) { map.removeLayer(routeLine); routeLine = null; }

            if (mode === 'live') {
                startLiveTracking();
            } else {
                if (liveListener) firebase.database().ref('/tracker').off('value', liveListener);
                loadPastRoute(mode);
            }
        }

        function startLiveTracking() {
            const bikeIcon = L.icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
                iconSize: [25, 41], iconAnchor: [12, 41]
            });

            liveListener = firebase.database().ref('/tracker').on('value', (snapshot) => {
                const data = snapshot.val();
                const statusBadge = document.getElementById('bt-status');
                
                if (data && data.connected === true) {
                    statusBadge.className = 'status-badge status-online';
                    statusBadge.innerText = 'Bluetooth: Connected (Live)';

                    if (data.lat && data.lng) {
                        const newPos = new L.LatLng(data.lat, data.lng);
                        if (!marker) {
                            marker = L.marker(newPos, {icon: bikeIcon}).addTo(map);
                        } else {
                            marker.setLatLng(newPos);
                        }
                        map.setView(newPos, 16);
                    }
                } else {
                    statusBadge.className = 'status-badge status-offline';
                    statusBadge.innerText = 'Bluetooth: Disconnected (Idle)';
                    if (marker) {
                        map.removeLayer(marker);
                        marker = null;
                    }
                }
            });
        }

        function loadPastRoute(rideKey) {
            firebase.database().ref('/rides/' + rideKey).once('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                let coords = [];
                for (let key in data) {
                    if (data[key].lat && data[key].lng) {
                        coords.push([data[key].lat, data[key].lng]);
                    }
                }

                if (coords.length > 0) {
                    routeLine = L.polyline(coords, {color: '#0056b3', weight: 5, opacity: 0.85}).addTo(map);
                    map.fitBounds(routeLine.getBounds(), {padding: [50, 50]});

                    const endIcon = L.icon({
                        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
                        iconSize: [25, 41], iconAnchor: [12, 41]
                    });
                    marker = L.marker(coords[coords.length - 1], {icon: endIcon}).addTo(map);
                }
            });
        }
    </script>
</body>
</html>
