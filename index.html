<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleetline | Live Tracker Console</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #0ea5e9;
            --success: #10b981;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            color: var(--accent);
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
        }

        .grid-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            flex-grow: 1;
            min-height: 0; /* Important for flex-child scrolling */
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }

        .panel h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        #connectBtn {
            background-color: var(--success);
            color: white;
            margin-bottom: 10px;
        }

        #connectBtn:hover { background-color: #059669; }

        #alarmBtn {
            background-color: var(--panel-bg);
            color: var(--danger);
            border: 2px solid var(--danger);
            height: 80px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0.5;
            cursor: not-allowed;
        }

        #alarmBtn.active-btn {
            background-color: var(--danger);
            color: white;
            opacity: 1;
            cursor: pointer;
        }

        #alarmBtn.active-btn.ringing {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        #map {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: #1a1a1a;
        }

        #logArea {
            height: 200px;
            overflow-y: auto;
            background: #0f172a;
            border: 1px inset var(--border);
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
            color: var(--success);
        }

        .log-entry { margin-bottom: 4px; }
        .log-time { color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1>FLEETLINE</h1>
            <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">BLE FLEET TRACKING CONSOLE</div>
        </div>
        <div>
            <span id="bleStatus" class="status-badge">● BLE Disconnected</span>
            <span id="gpsStatus" class="status-badge">● No GPS Fix</span>
        </div>
    </div>

    <div class="grid-container">
        
        <div class="sidebar">
            <div class="panel">
                <h3>Connection</h3>
                <button id="connectBtn">⚡ Connect to Tracker</button>
                <div style="font-size: 12px; color: var(--text-muted); margin-top: 10px;">
                    Target ID: Delivery_Bike_Tracker
                </div>
            </div>

            <div class="panel">
                <h3>Remote Alarm</h3>
                <button id="alarmBtn" disabled>
                    🔔 SOUND ALARM
                    <span style="font-size: 12px; font-weight: normal; margin-top: 5px;">Requires Connection</span>
                </button>
            </div>

            <div class="panel" style="flex-grow: 1; display: flex; flex-direction: column;">
                <h3>Telemetry Log</h3>
                <div id="logArea">
                    <div class="log-entry">System ready. Waiting for connection...</div>
                </div>
            </div>
        </div>

        <div class="map-wrapper" style="position: relative; height: 100%;">
            <div id="map"></div>
        </div>

    </div>

    <script>
        // --- Web Bluetooth Settings ---
        const SERVICE_UUID = "4fafc201-1bf5-4fd5-9365-1c7356d81b31";
        const GPS_CHAR_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";     // Read/Notify from ESP32
        const BUZZER_CHAR_UUID = "a1b2c3d4-e5f6-4a5b-8c9d-0e1f2a3b4c5d";  // Write to ESP32

        let bleDevice, buzzerCharacteristic;
        let isAlarmOn = false;

        // --- Map Initialization ---
        // Using a dark CartoDB basemap for the SaaS look
        const map = L.map('map').setView([20.5937, 78.9629], 5); // Default to India
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        let bikeMarker;
        let pathLine = L.polyline([], {color: '#0ea5e9', weight: 3}).addTo(map);

        // --- UI Elements ---
        const btnConnect = document.getElementById('connectBtn');
        const btnAlarm = document.getElementById('alarmBtn');
        const logArea = document.getElementById('logArea');
        const bleStatus = document.getElementById('bleStatus');
        const gpsStatus = document.getElementById('gpsStatus');

        function addLog(msg) {
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            logArea.innerHTML = `<div class="log-entry"><span class="log-time">[${time}]</span> ${msg}</div>` + logArea.innerHTML;
        }

        // --- Bluetooth Connection Logic ---
        btnConnect.addEventListener('click', async () => {
            try {
                addLog("Requesting device connection...");
                
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Delivery_Bike_Tracker' }],
                    optionalServices: [SERVICE_UUID]
                });

                // Handle disconnection
                bleDevice.addEventListener('gattserverdisconnected', () => {
                    addLog("❌ Device disconnected.");
                    bleStatus.style.color = "inherit";
                    bleStatus.innerText = "● BLE Disconnected";
                    btnAlarm.disabled = true;
                    btnAlarm.classList.remove('active-btn', 'ringing');
                });

                addLog("Connecting to GATT Server...");
                const server = await bleDevice.gatt.connect();
                
                const service = await server.getPrimaryService(SERVICE_UUID);
                
                // 1. Setup GPS Notifications
                const gpsChar = await service.getCharacteristic(GPS_CHAR_UUID);
                await gpsChar.startNotifications();
                gpsChar.addEventListener('characteristicvaluechanged', handleGpsUpdate);
                
                // 2. Setup Buzzer Write Characteristic
                buzzerCharacteristic = await service.getCharacteristic(BUZZER_CHAR_UUID);

                // UI Updates on Success
                addLog("✅ Connected successfully!");
                bleStatus.style.color = "var(--success)";
                bleStatus.innerText = "● BLE Connected";
                
                // Enable Alarm Button
                btnAlarm.disabled = false;
                btnAlarm.classList.add('active-btn');
                btnAlarm.innerHTML = "🔔 TRIGGER ALARM";

            } catch (error) {
                addLog("Error: " + error.message);
            }
        });

        // --- Handle Incoming GPS Data ---
        function handleGpsUpdate(event) {
            const value = new TextDecoder().decode(event.target.value);
            const coords = value.split(',');

            if(coords.length === 2) {
                const lat = parseFloat(coords[0]);
                const lng = parseFloat(coords[1]);

                gpsStatus.style.color = "var(--success)";
                gpsStatus.innerText = "● GPS Lock Active";
                addLog(`📍 Location update: ${lat.toFixed(6)}, ${lng.toFixed(6)}`);

                // Update Map
                if(!bikeMarker) {
                    bikeMarker = L.marker([lat, lng]).addTo(map);
                    map.setView([lat, lng], 18); // Zoom in close on first fix
                } else {
                    bikeMarker.setLatLng([lat, lng]);
                    map.panTo([lat, lng]);
                }
                
                // Add point to trail
                pathLine.addLatLng([lat, lng]);
            }
        }

        // --- Handle Alarm Button Click ---
        btnAlarm.addEventListener('click', async () => {
            if (!buzzerCharacteristic) return;

            try {
                isAlarmOn = !isAlarmOn; // Toggle state
                
                // The ESP32 expects "1" for ON, "0" for OFF
                const payload = isAlarmOn ? "1" : "0";
                const encoder = new TextEncoder();
                
                addLog(`Sending alarm command: ${payload}`);
                await buzzerCharacteristic.writeValue(encoder.encode(payload));

                // Update Button UI based on state
                if(isAlarmOn) {
                    btnAlarm.classList.add('ringing');
                    btnAlarm.innerHTML = "🔕 STOP ALARM";
                    addLog("🔊 ALARM TRIGGERED!");
                } else {
                    btnAlarm.classList.remove('ringing');
                    btnAlarm.innerHTML = "🔔 TRIGGER ALARM";
                    addLog("🔈 Alarm silenced.");
                }

            } catch (error) {
                addLog("Error sending alarm command: " + error);
                isAlarmOn = !isAlarmOn; // Revert state if failed
            }
        });
    </script>
</body>
</html>
