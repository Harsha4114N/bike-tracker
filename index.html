<!DOCTYPE html>
<html>
<head>
    <title>Autonomous Tracker Admin</title>
    <!-- Leaflet JS & CSS for Free Mapping -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Firebase v8 Compatibility SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f7f6; }
        
        /* Secure Login Screen */
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        .input-field { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        .btn { background: #007bff; color: white; padding: 12px; width: 100%; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px;}
        .btn:hover { background: #0056b3; }
        
        /* Dashboard & Map */
        #dashboard { display: none; height: 100vh; flex-direction: column; }
        #header { background: #2c3e50; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold;}
        #map { flex-grow: 1; width: 100%; }
    </style>
</head>
<body>

    <!-- Admin Login Interface -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Admin Login</h2>
            <p style="color: gray; font-size: 14px;">Authorized Personnel Only</p>
            <input type="email" id="email" class="input-field" placeholder="Admin Email">
            <input type="password" id="password" class="input-field" placeholder="Password">
            <button class="btn" onclick="adminLogin()">SECURE LOGIN</button>
            <p id="error-msg" style="color: red; font-size: 14px; display: none;"></p>
        </div>
    </div>

    <!-- Live Tracking Dashboard -->
    <div id="dashboard">
        <div id="header">🟢 Live GPS Dashboard</div>
        <div id="map"></div>
    </div>

    <script>
        // 1. Initialize Firebase (Using your specific project keys)
        const firebaseConfig = {
            apiKey: "AIzaSyB8ldMOqZIzZrJghi0ykiZBrHEl2SNnTsU",
            authDomain: "delivery-tracker-e1fef.firebaseapp.com",
            databaseURL: "https://delivery-tracker-e1fef-default-rtdb.firebaseio.com",
            projectId: "delivery-tracker-e1fef",
            storageBucket: "delivery-tracker-e1fef.firebasestorage.app",
            messagingSenderId: "481064109063",
            appId: "1:481064109063:web:08c552023c98b7fe3996a2"
        };
        firebase.initializeApp(firebaseConfig);

        let map, marker;

        // 2. Authentication Logic
        function adminLogin() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            
            firebase.auth().signInWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    // Success: Hide login, show dashboard
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'flex';
                    startLiveTracking();
                })
                .catch((error) => {
                    // Failed: Show error message
                    const errorBox = document.getElementById('error-msg');
                    errorBox.innerText = "Access Denied: Invalid Admin Credentials";
                    errorBox.style.display = 'block';
                });
        }

        // 3. Map & Real-time Database Logic
        function startLiveTracking() {
            // Initialize Leaflet Map centered roughly on Bangalore
            map = L.map('map').setView([12.9716, 77.5946], 13);
            
            // Load the street map tiles from OpenStreetMap
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            // Create a red marker for the bike
            const bikeIcon = L.icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
                iconSize: [25, 41], iconAnchor: [12, 41]
            });
            marker = L.marker([12.9716, 77.5946], {icon: bikeIcon}).addTo(map);

            // Listen to the Firebase Database for changes
            const dbRef = firebase.database().ref('/tracker/live');
            dbRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && data.lat && data.lng) {
                    // Instantly update the marker position when ESP32 uploads new data
                    const newLatLng = new L.LatLng(data.lat, data.lng);
                    marker.setLatLng(newLatLng);
                    map.setView(newLatLng, 16); // Auto-pan the camera to the bike
                }
            });
        }
    </script>
</body>
</html>
